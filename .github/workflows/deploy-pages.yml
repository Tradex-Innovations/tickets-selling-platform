name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Set Pages URL prefix
        shell: bash
        run: |
          shopt -s nocasematch
          repo_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo_name" == "$GITHUB_REPOSITORY_OWNER.github.io" ]]; then
            echo 'NEXT_PUBLIC_BASE_PATH=' >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/$repo_name" >> "$GITHUB_ENV"
          fi
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm test
      - name: Export static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_ORGANIZER_PREVIEW: "true"
      - name: Verify organizer-only export
        run: |
          test -f out/seller/index.html
          test -f out/account/index.html
          for route in admin venue-manager box-office check-in; do
            test ! -e "out/$route"
          done
      - name: Preserve Next.js assets on Pages
        run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
